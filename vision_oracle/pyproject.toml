[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-vision-oracle"
version = "0.1.0"
description = "Localized Multimodal Vision-Semantic Oracle (Component 3 of HEART Framework)"
authors = [
    { name = "M.L. Booso", email = "it23452916@my.sliit.lk" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
c3-oracle = "local_vision_oracle.cli:main"

[tool.setuptools.packages.find]
include = ["local_vision_oracle*"]
