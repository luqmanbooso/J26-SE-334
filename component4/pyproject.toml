[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-component4"
version = "0.1.0"
description = "Telemetry-driven self-healing test synthesis engine"
requires-python = ">=3.10"
dependencies = [
    "Appium-Python-Client>=3,<4",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
c4 = "c4.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live_llm: requires a running local Ollama Qwen3 service",
]
