name: HEART CI - Test & Build Verification

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Test Suite & RQ1 Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libtk8.6 libtcl8.6

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "env testing/requirements.txt"
          pip install pytest pytest-cov httpx pillow pyyaml customtkinter psutil

      - name: Verify Python Syntax Compilation
        run: |
          python -m py_compile c1_desktop_app.py
          python -m py_compile "env testing/server.py"

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          xvfb-run python -m pytest "env testing/tests" -v --junitxml=reports/junit.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: reports/junit.xml
          if-no-files-found: ignore

  frontend-build:
    name: Frontend React/Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Vite Production Assets
        working-directory: frontend
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
